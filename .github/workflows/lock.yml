name: Aureum Chain Lock
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lock-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lock M7 manifest (master hash)
        run: |
          sha256sum -c <<< "fd4451762e1f60b0a72b08919723f4ed016cbbad75849434ed638f6e4a1744ba  data/m_outputs/m7.out"
          echo "M7 manifest lock verified."

      - name: Lock kappa constant
        run: |
          sha256sum -c <<< "58277ad6be29d05469e098ea9fadae98cdecb4f2bff1717adaa216891afa0683  data/constants/kappa.txt"
          echo "Kappa lock verified."

      - name: Lock alpha0 constant
        run: |
          sha256sum -c <<< "3a6523cd084e6482e76be1a0ceb1fc5c6175944a80c860151943555bb723eda6  data/constants/alpha0.txt"
          echo "Alpha0 lock verified."

      - name: Chain integrity summary
        run: |
          echo "==================================="
          echo "Opera Numerorum — Aureum chain lock"
          echo "M7 manifest: LOCKED"
          echo "kappa:        LOCKED"
          echo "alpha0:       LOCKED"
          echo "==================================="
